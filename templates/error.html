{% extends "base.html" %}
{% block title %}Request refused — Exam Arena{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-3xl border border-red-100 bg-white p-8 text-center shadow-sm sm:p-10">
  <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-red-50 text-2xl text-red-600">!</div>
  <h1 class="mt-5 text-2xl font-black text-slate-900">Request refused</h1>
  <p class="mt-3 leading-7 text-slate-600">{{ message }}</p>
  <a href="{{ back_url }}" class="mt-7 inline-flex rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white hover:bg-indigo-700">Return to dashboard</a>
</section>
{% endblock %}
